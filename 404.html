<!DOCTYPE html>
<html lang="en">
<head>

<title>Page not found | Japhette Alec Pulido</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f6f5fd;--ink:#1a1840;--muted:#5b5a7d;--accent:#4b3fd6;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#13112b;--ink:#ecebfa;--muted:#a8a6cf;--accent:#9c93ff;--accent-ink:#13112b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:32rem}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:0 0 .75rem}
p{color:var(--muted);margin:0 0 1.5rem}
a{display:inline-block;padding:.7rem 1.3rem;border-radius:.5rem;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>

<main>
<h1>That page doesn’t exist.</h1>
